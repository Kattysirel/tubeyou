name: Frontend CI - Validation & Build

# Se ejecuta en cada Pull Request hacia main (y manualmente). NO despliega nada.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint & Compile Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Compile & Build Frontend (Vite)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Verify build artifact
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html was not generated!"
            exit 1
          fi
          echo "Frontend built successfully. Ready for PR review."

  validate-backend:
    name: Install & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (pytest)
        run: python -m pytest
