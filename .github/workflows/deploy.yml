name: TubeYou - CI/CD (AWS)

# Pull Request a main  -> validaciones (backend + frontend). NO despliega.
# Push / merge a main  -> validaciones + despliegue del frontend a S3 con OIDC (sin claves permanentes).
# El backend (FastAPI) se actualiza a mano en la EC2: git pull + pm2 restart fastapi.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tubeyou-${{ github.workflow }}-${{ github.ref }}
  # En PR se cancela la ejecucion anterior; en main nunca se interrumpe un despliegue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend - instalar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Comprobar que la API importa correctamente
        run: python -c "from main import app; print('rutas:', len(app.routes))"
        env:
          PYTHONPATH: src
          DATABASE_URL: sqlite:///./ci-check.db

      - name: Pruebas (pytest)
        run: python -m pytest

  # --------------------------------------------------------------- Frontend
  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de produccion (Vite)
        run: npm run build
        env:
          # URL publica de la API (variable del repositorio). En PR se usa un valor de prueba.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      - name: Verificar que se genero dist/
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html no se genero"
            exit 1
          fi
          echo "Frontend compilado correctamente."

      - name: Guardar dist/ como artefacto
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------- Deploy
  deploy-frontend:
    name: Desplegar frontend en S3 (OIDC)
    # Nunca en pull_request. Se omite mientras no exista la variable S3_BUCKET_NAME (AWS sin configurar).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.S3_BUCKET_NAME != ''
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar dist/
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Autenticarse en AWS con OIDC (credenciales temporales)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-skip-session-tagging: true

      - name: Subir dist/ a S3
        run: |
          echo "Sincronizando dist con s3://${{ vars.S3_BUCKET_NAME }} ..."
          # Archivos con hash: cache larga (sin index.html)
          aws s3 sync dist "s3://${{ vars.S3_BUCKET_NAME }}" --delete \
            --cache-control "max-age=31536000,public,immutable" \
            --exclude "index.html"
          # index.html siempre fresco
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET_NAME }}/index.html" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Verificar despliegue
        run: |
          aws s3 ls "s3://${{ vars.S3_BUCKET_NAME }}/index.html"
          aws s3 ls "s3://${{ vars.S3_BUCKET_NAME }}/assets/" | head -5
          echo "Frontend publicado en s3://${{ vars.S3_BUCKET_NAME }}"
