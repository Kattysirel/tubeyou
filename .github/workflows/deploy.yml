name: TubeYou - CI/CD (AWS)

# Pull Request a main  -> solo validaciones (NO despliega)
# Push / merge a main  -> validaciones + despliegue a AWS (OIDC, sin claves permanentes)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tubeyou-${{ github.workflow }}-${{ github.ref }}
  # En PR se cancela la ejecucion anterior; en main nunca se interrumpe un despliegue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend - instalar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar que la API importa correctamente
        run: python -c "from src.main import app; print('rutas:', len(app.routes))"
        env:
          DATABASE_URL: sqlite:///./ci-check.db

      - name: Pruebas (pytest)
        run: python -m pytest -q

  # --------------------------------------------------------------- Frontend
  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de produccion
        run: npm run build
        env:
          # URL publica de la API (variable del repositorio). En PR se usa un valor de prueba.
          VITE_API_URL: ${{ vars.API_URL || 'http://localhost:8000' }}

      - name: Guardar dist/ como artefacto
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------- Deploy
  deploy:
    name: Desplegar en AWS
    # Nunca en pull_request: solo push/merge a main o ejecucion manual desde main.
    # Se omite mientras no exista la variable AWS_ROLE_ARN (AWS aun sin configurar).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Autenticarse en AWS con OIDC (credenciales temporales)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: tubeyou-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Descargar dist/
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Frontend -> S3 (solo el contenido de dist/)
        run: |
          # Archivos con hash: cache larga
          aws s3 sync dist "s3://${{ vars.S3_FRONTEND_BUCKET }}" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          # index.html siempre fresco
          aws s3 cp dist/index.html "s3://${{ vars.S3_FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Backend -> EC2 (AWS Systems Manager, sin SSH)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "TubeYou deploy ${{ github.sha }}" \
            --parameters 'commands=["sudo -u ec2-user bash /opt/tubeyou/deploy/deploy_backend.sh ${{ github.sha }}"]' \
            --query "Command.CommandId" --output text)
          echo "Comando SSM: $COMMAND_ID"

          # Espera a que termine; si falla, muestra la salida y aborta
          if ! aws ssm wait command-executed \
              --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "[StandardOutputContent,StandardErrorContent]" --output text
            exit 1
          fi

      - name: Verificar despliegue
        run: |
          API="${{ vars.API_URL }}"
          SITE="${{ vars.FRONTEND_URL }}"

          check() {
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$1" || true)
              if [ "$code" = "200" ]; then echo "OK  $1"; return 0; fi
              echo "intento $i: $1 -> HTTP $code"; sleep 5
            done
            echo "FALLO $1" >&2; return 1
          }

          check "$API/health"
          check "$API/docs"
          check "$API/videos"
          check "$SITE/"
